<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>うちゅうどくしょスタンプ</title>
<style>
:root{--bg:#0b1230;--bg2:#16204a;--card:#1d2a5c;--ink:#f3f6ff;--sub:#9fb0e6;--fire:#ff7a2f;--cy:#4fd1ff;--gold:#ffd23f;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(circle at 20% 0,#26357a,var(--bg) 60%) fixed,var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN",sans-serif;font-size:16px}
#app{max-width:480px;margin:0 auto;padding:12px 12px 40px}
h1{font-size:20px;margin:4px 0 2px}
.rank{color:var(--gold);font-size:15px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat{background:var(--card);border-radius:14px;padding:8px 4px;text-align:center}
.stat b{display:block;font-size:26px;color:var(--cy)}
.stat span{font-size:12px;color:var(--sub)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:12px 0;border:0;border-radius:12px;background:var(--bg2);color:var(--sub);font:inherit;font-weight:700}
.tabs button.on{background:var(--fire);color:#fff}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-size:18px;font-weight:700}
.nav button{width:48px;height:44px;border:0;border-radius:12px;background:var(--bg2);color:var(--ink);font-size:20px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.wd{text-align:center;font-size:12px;color:var(--sub);padding:2px 0}
.day{aspect-ratio:1/1.1;background:var(--card);border-radius:8px;border:2px solid transparent;padding:2px;font-size:11px;color:var(--sub);overflow:hidden;position:relative;line-height:1.1}
.day.f{opacity:.35}
.day.t{border-color:var(--cy)}
.day.s{border-color:var(--fire);background:#2b3a7a}
.day i{font-style:normal;display:block;font-size:15px;line-height:1.05;word-break:break-all}
.day em{position:absolute;right:3px;bottom:1px;font-style:normal;color:var(--gold);font-weight:700}
.panel{background:var(--card);border-radius:16px;padding:12px;margin-top:10px}
.panel h2{font-size:16px;margin:0 0 8px}
.pick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pick button{aspect-ratio:1;border:3px solid transparent;border-radius:12px;background:var(--bg2);font-size:28px;padding:0}
.pick button.on{border-color:var(--fire);background:#3a2a4a}
.pick button.lk{filter:grayscale(1) brightness(.4);font-size:20px}
.go{width:100%;margin-top:10px;padding:16px;border:0;border-radius:16px;background:linear-gradient(var(--fire),#e5531a);color:#fff;font:inherit;font-size:20px;font-weight:800;box-shadow:0 5px 0 #a03a0e}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 #a03a0e}
.go:disabled{opacity:.4}
.undo{margin-top:8px;background:none;border:0;color:var(--sub);font:inherit;text-decoration:underline;padding:8px}
.zk{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.zc{background:var(--card);border-radius:14px;padding:10px;text-align:center}
.zc .e{font-size:44px}
.zc.lk .e{filter:brightness(0);opacity:.35}
.zc small{display:block;color:var(--sub);font-size:12px}
.zc b{font-size:14px}
.rar{color:var(--gold);font-size:12px}
textarea{width:100%;height:120px;border-radius:10px;border:0;padding:8px;background:var(--bg2);color:var(--ink);font-size:12px}
.row{display:flex;gap:8px;margin-top:8px}
.row button{flex:1;padding:12px;border:0;border-radius:12px;background:var(--cy);color:#06223a;font:inherit;font-weight:700}
.note{color:var(--sub);font-size:13px;line-height:1.5}
#pop{position:fixed;inset:0;background:rgba(5,8,25,.82);display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;z-index:9;padding:20px}
#pop .big{font-size:110px;animation:pon .5s cubic-bezier(.2,1.6,.4,1)}
#pop p{font-size:22px;font-weight:800;margin:6px 0;color:var(--gold)}
#pop small{color:var(--sub)}
@keyframes pon{0%{transform:scale(2.6) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@media(prefers-reduced-motion:reduce){#pop .big{animation:none}}
</style></head><body>
<div id="app"></div>
<div id="pop" onclick="this.style.display='none'"></div>
<script>
const S=[
{id:'rocket',e:'🚀',n:'ロケット',d:0},{id:'robot',e:'🤖',n:'ロボット',d:0},{id:'star',e:'⭐',n:'ほし',d:0},
{id:'moon',e:'🌙',n:'つき',d:3},{id:'ufo',e:'🛸',n:'ユーフォー',d:7},{id:'planet',e:'🪐',n:'わくせい',d:14},
{id:'alien',e:'👽',n:'うちゅうじん',d:21},{id:'sat',e:'🛰️',n:'えいせい',d:30},{id:'comet',e:'☄️',n:'すいせい',d:50},{id:'gal',e:'🌌',n:'ぎんが',d:100}];
const R=[[0,'うちゅうの みならい'],[5,'うちゅうひこうし'],[15,'ロボットはかせ'],[30,'ぎんがたんけんか'],[60,'うちゅうたいちょう'],[100,'どくしょマスター']];
const rar=d=>d<3?'★ ふつう':d<=14?'★★ レア':d<=30?'★★★ スーパーレア':'★★★★ ウルトラレア';
const p=n=>String(n).padStart(2,'0');
const K=d=>d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
const def=()=>({days:{},best:0,pick:'rocket'});
let st=load(),view='cal',now=new Date(),y=now.getFullYear(),m=now.getMonth(),sel=K(now);
function load(){try{return Object.assign(def(),JSON.parse(localStorage.getItem('ds1')||'{}'))}catch(e){return def()}}
function save(){try{localStorage.setItem('ds1',JSON.stringify(st))}catch(e){}}
const has=k=>(st.days[k]||[]).length>0;
function cur(){let d=new Date(),n=0;if(!has(K(d)))d.setDate(d.getDate()-1);while(has(K(d))){n++;d.setDate(d.getDate()-1)}return n}
function longest(){const ks=Object.keys(st.days).filter(has).sort();let b=0,r=0,pv=null;for(const k of ks){const[a,bb,c]=k.split('-').map(Number),t=Date.UTC(a,bb-1,c)/864e5;r=(pv!==null&&t-pv===1)?r+1:1;pv=t;if(r>b)b=r}return b}
const best=()=>Math.max(st.best,longest(),cur());
const total=()=>Object.values(st.days).reduce((a,v)=>a+v.length,0);
const rank=()=>{const t=total();let r=R[0][1];for(const x of R)if(t>=x[0])r=x[1];return r};
const un=b=>S.filter(s=>s.d<=b);
function pop(e,t,s,sticky){const o=document.getElementById('pop');o.innerHTML='<div class="big">'+e+'</div><p>'+t+'</p><small>'+(s||'')+'</small>';o.style.display='flex';if(!sticky)setTimeout(()=>{o.style.display='none'},900)}
function stamp(){
 if(sel>K(new Date()))return;
 const before=un(best()).length;
 (st.days[sel]=st.days[sel]||[]).push(st.pick);
 st.best=best();save();
 const s=S.find(x=>x.id===st.pick),a=un(st.best);
 if(a.length>before){const ns=a[a.length-1];render();pop(ns.e,'あたらしい スタンプ ゲット！',ns.n+'（'+rar(ns.d)+'）　タップで とじる',true)}
 else{render();pop(s.e,'ポンッ！','')}
}
function undo(){const a=st.days[sel]||[];if(!a.length)return;if(confirm('さいごの スタンプを けす？')){a.pop();save();render()}}
function render(){
 const b=best(),a=document.getElementById('app');
 let h='<h1>🚀 うちゅうどくしょスタンプ</h1><div class="rank">'+rank()+'</div>';
 h+='<div class="stats"><div class="stat"><b>'+cur()+'</b><span>れんぞく(にち)</span></div><div class="stat"><b>'+total()+'</b><span>よんだ さつ</span></div><div class="stat"><b>'+un(b).length+'/'+S.length+'</b><span>ずかん</span></div></div>';
 h+='<div class="tabs">'+[['cal','カレンダー'],['zk','ずかん'],['sv','ほぞん']].map(x=>'<button class="'+(view===x[0]?'on':'')+'" onclick="view=\''+x[0]+'\';render()">'+x[1]+'</button>').join('')+'</div>';
 if(view==='cal'){
  h+='<div class="nav"><button onclick="mv(-1)">◀</button><span>'+y+'ねん '+(m+1)+'がつ</span><button onclick="mv(1)">▶</button></div><div class="cal">';
  h+='日月火水木金土'.split('').map(c=>'<div class="wd">'+c+'</div>').join('');
  const f=new Date(y,m,1).getDay(),dn=new Date(y,m+1,0).getDate(),td=K(new Date());
  for(let i=0;i<f;i++)h+='<div></div>';
  for(let d=1;d<=dn;d++){const k=y+'-'+p(m+1)+'-'+p(d),v=st.days[k]||[];
   h+='<div class="day'+(k>td?' f':'')+(k===td?' t':'')+(k===sel?' s':'')+'" onclick="sel=\''+k+'\';render()">'+d+'<i>'+v.slice(0,4).map(id=>S.find(s=>s.id===id).e).join('')+'</i>'+(v.length>4?'<em>+'+(v.length-4)+'</em>':'')+'</div>'}
  h+='</div>';
  const[sy,sm,sd]=sel.split('-').map(Number),n=(st.days[sel]||[]).length;
  h+='<div class="panel"><h2>'+sm+'がつ'+sd+'にち　（'+n+'さつ）</h2><div class="pick">'+S.map(s=>s.d<=b?'<button class="'+(st.pick===s.id?'on':'')+'" onclick="st.pick=\''+s.id+'\';save();render()">'+s.e+'</button>':'<button class="lk" onclick="pop(\'🔒\',\''+s.d+'にち れんぞくで ゲット！\',\'\')">🔒</button>').join('')+'</div>';
  h+='<button class="go" onclick="stamp()" '+(sel>td?'disabled':'')+'>'+S.find(s=>s.id===st.pick).e+' ほんを よんだ！ ポン！</button>';
  if(n)h+='<button class="undo" onclick="undo()">さいごの スタンプを けす</button>';
  h+='</div>';
 }
 if(view==='zk'){
  const cnt={};Object.values(st.days).flat().forEach(i=>cnt[i]=(cnt[i]||0)+1);
  h+='<div class="zk">'+S.map(s=>{const o=s.d<=b;return '<div class="zc'+(o?'':' lk')+'"><div class="e">'+s.e+'</div><b>'+(o?s.n:'？？？')+'</b><div class="rar">'+rar(s.d)+'</div><small>'+(o?(cnt[s.id]||0)+'かい おした':s.d+'にち れんぞくで ゲット')+'</small></div>'}).join('')+'</div>';
 }
 if(view==='sv'){
  h+='<div class="panel"><h2>きろくの バックアップ</h2><p class="note">スマホの データが きえたときのために、ここの もじを メモに コピーして とっておこう。</p><textarea id="bk">'+JSON.stringify(st)+'</textarea><div class="row"><button onclick="cp()">コピー</button><button onclick="rs()">よみこむ</button></div><p class="note">「よみこむ」は、うえの はこに バックアップを はりつけてから おす。</p></div>';
 }
 a.innerHTML=h;
}
function mv(d){m+=d;if(m<0){m=11;y--}if(m>11){m=0;y++}render()}
function cp(){const t=document.getElementById('bk');t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand('copy')}pop('📋','コピーした！','')}
function rs(){try{const o=JSON.parse(document.getElementById('bk').value);if(!o.days)throw 0;if(confirm('いまの きろくを おきかえる？')){st=Object.assign(def(),o);save();render();pop('✅','よみこめた！','')}}catch(e){alert('よみこめなかった。もういちど コピーしてね。')}}
render();
</script></body></html>
